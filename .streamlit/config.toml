# Plain, light theme: white figures sit on a white page, one muted accent colour.
[theme]
base = "light"
primaryColor = "#1f4e79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f7"
textColor = "#1c2430"
font = "sans-serif"
codeFont = "monospace"
baseRadius = "small"
borderColor = "#d5dbe1"
showWidgetBorder = true
headingFontSizes = ["1.75rem", "1.25rem", "1.05rem", "0.95rem", "0.9rem", "0.85rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]

[theme.sidebar]
backgroundColor = "#f3f5f7"
secondaryBackgroundColor = "#ffffff"

[client]
toolbarMode = "minimal"
